        clab-prueba2-practica-pc2:
          ansible_host: 172.20.20.3
        clab-prueba2-practica-pc3:
          ansible_host: 172.20.20.4
        clab-prueba2-practica-pc4:
          ansible_host: 172.20.20.9
        clab-prueba2-practica-pc5:
          ansible_host: 172.20.20.10
